name: gates (tier 1 - every PR)

# R6-CI-01: CI is THREE TIERS, and this file is tier 1.
#
#   tier 1  .github/workflows/gates.yml                  every push / PR
#           locks + mutants, ledger/catalogue/plan + mutants, fmt +
#           `git diff --check` + Clippy/warning ratchet, control core +
#           workerd + standing mutants, storage/durability unit, the STRICT
#           negative epoch suite, a SHORT provider corpus, the
#           dependency/advisory/source-truth scans, the deterministic
#           CODE-QUALITY controller (`cargo xtask quality`, tiers A/B of the
#           agentic quality spec), and the zizmor workflow audit.
#
#   tier 2  .github/workflows/nightly.yml                nightly + pre-live
#           storage integrations + bench compile, full feature-off and
#           feature-on SlateDB suites, the FULL S3 crash/fault corpus on
#           RustFS with the MinIO comparator, managed local E2Es, the
#           full dependency/security scans, the FULL quality campaign
#           (`cargo xtask quality full`, tier C), and the zizmor audit
#           against newly-published rules.
#
#   tier 3  .github/workflows/release-qualification.yml  release only
#           clean hermetic environment, full plan + leaf evidence, Mode Q,
#           immutable release identity + SBOM + provenance + tested-artifact
#           digests, and the full quality campaign re-run and SHA-bound to
#           the commit being released.
#
# Two rules bind all three (§11):
#   * No job may use `continue-on-error` for a release predicate. There is
#     no `continue-on-error:` key on any job or step below - only in the
#     comments that explain why it is refused.
#   * ENVIRONMENT-BLOCKED is a DISTINCT non-green state. It is neither a
#     pass nor a source failure: `tools/ci/capability_probe.py` classifies
#     the runner, the lane runs only when CAPABLE, and a separate
#     `*-environment-blocked` job FAILS with exit 75 and an
#     `::error title=ENVIRONMENT-BLOCKED::` annotation when it is not.
#     `continue-on-error` would have made it green; `if:` alone would have
#     made it skipped, which required-checks also treat as green.
#
# PR7 (audit E-P0-09): CI is the fail-closed truth plane. Every job below
# fails closed, and every action is pinned by commit SHA with exact runner
# images and exact tool versions - a floating tag cannot silently change
# what "green" meant.
#
# What is enforced on every push/PR:
#   - document/gate authority: the machine ledger, its rendered status, and
#     the forbidden-claims linter over the live status docs (round-3 E-07:
#     plus unique ids, status enums, commit-ancestry and evidence-path
#     verification - which is why the truth-plane checkout fetches FULL
#     history);
#   - source/tool/workspace locks against a real materialisation, plus the
#     lock checker's own behavioral mutants;
#   - Mode-Q: the SEMANTIC bundle validator (round-3 E-01) - absence keeps
#     G0 open, presence must validate (schema, raw-byte hashes, source pin,
#     approved argv grammar, cquery stdout line grammar, current workspace-
#     lock equality, bijective crosswalk, safe filenames, content root -
#     R4-MODEQ-01), and the validator's own eleven mutants are executed on
#     every push; two-directional ledger consistency is enforced by the
#     same validator;
#   - evidence producers kill their own mutants; the ARCHIVED corpus bundle
#     re-verifies from raw logs (reparse + hash binding + bundle root), and
#     the INDEPENDENT verifier (tools/evidence/verify_all.py, R4-EVID-03a:
#     verdict enum, policy re-derivation, canonical plan-root recompute)
#     re-verifies it too and kills its own mutants (R4-EVID-01);
#   - the v2 qualification plan has not drifted from the catalogue
#     (build_plan_v2 --check), and plan coverage is EXPECTED-RED: the
#     committed plan-coverage-v2.json must regenerate byte-identically and
#     the tool must exit 1 (the plan is NOT satisfied; a green or drifted
#     coverage result fails CI) - R4-EVID-01;
#   - R5-EVID-01 (closes R4-EVID-01a): the catalogue/plan are regenerated
#     against the CURRENT source lock, and the --require-current-lock steps
#     are HARD failures - a source-lock change without catalogue/plan
#     regeneration turns CI red instead of emitting a warning;
#   - catalogue schema validation and negative controls;
#   - control plane: typecheck, node suites (incl. the era-A migration
#     fixtures and crash matrix), standing mutant, workerd lane, the full
#     protocol E2E on real workerd, and the 14-probe harness self-test;
#   - storage: protocol models + storage library over the staged fork;
#   - CODE QUALITY (the agentic quality specification, §14.1/§14.2): the
#     deterministic controller `cargo xtask quality`, whose policy lives in
#     `.quality/` and never in this file. On a pull_request it runs
#     `policy-check --base` then `pr --base` against the TRUSTED base SHA;
#     on a bare push there is no trusted base, so it runs `fast` and says so
#     in an annotation rather than inventing a baseline from the tree under
#     test. The job is never `if:`-skipped and carries no
#     `continue-on-error:` - see its own header for why every cheaper shape
#     was refused;
#   - WORKFLOW SECURITY: `zizmor` over `.github/workflows/**`, installed
#     from a sha256-verified wheel rather than an unpinned action, at the
#     default persona with no severity or confidence floor. The one
#     suppressed finding is ignored by exact line in `.github/zizmor.yml`
#     with its argument written down.
#
# What is deliberately NOT in TIER 1, and where it moved (recorded, not
# hidden - R6-CI-01 turned most of this list from "nowhere" into "tier 2/3"):
#   - the full U2S3 corpus (needs a ~9 GB build, ~2 h): tier 2 (nightly);
#     its archived evidence is re-verified from raw logs in this tier;
#   - storage INTEGRATION tests and bench compile: tier 2 (they were
#     dispatch-only before this change, i.e. effectively never);
#   - the FULL S3 crash/fault corpus and the MinIO comparator: tier 2; a
#     SHORT RustFS semantics run is in this tier;
#   - managed local Node/Rust E2Es: tier 2;
#   - official driver gates (E-P0-08): no driver harness exists yet - the
#     ledger's OFFICIAL_DRIVERS lane records NOT_IMPLEMENTED. Tier 2 carries
#     the placeholder job so its absence is visible rather than assumed;
#   - SBOM / signed provenance / tested-equals-shipped digests / Mode-Q
#     release evidence: tier 3. The release identity that binds them
#     (R6-PORT-01, RELEASE-IDENTITY.json) is checked in THIS tier, because a
#     release cannot be identified by an artifact nobody validated earlier.
#
# OS packages come from the pinned runner image (ubuntu-24.04); apt installs
# below are bounded by that image, which is the strongest pin GitHub offers
# for distro packages.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# R5-CI-01: minimal token authority for every job - nothing here publishes,
# comments, or writes; a compromised step must not be able to either.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# pinned action SHAs (resolved 2026-08-18):
#   actions/checkout v4.4.0       11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python v5.6.0   a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/setup-node v4.4.0     49933ea5288caeca8642d1e84afbd3f7d6820020
#   dtolnay/rust-toolchain        6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772

jobs:
  truth-plane:
    # Document authority, the checkers' own negative controls, and the
    # committed evidence - validated from a clean checkout with no source
    # materialisation.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history: the ledger linter (E-07) verifies that every
          # commit the ledger cites exists and is an ancestor of HEAD -
          # a shallow clone cannot answer that and the check fails closed
          fetch-depth: 0
          # R5-CI-01: no step after checkout needs the repo token
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - name: gate ledger is well-formed, rendered status matches, no forbidden claims
        run: python3 tools/ledger/lint_ledger.py
      - name: the ledger linter kills its own mutants (R5-REL-01)
        # duplicate ids, out-of-enum states, closed action without commits /
        # with a nonexistent or non-ancestor commit, blocking-finding
        # contradiction against a closed action's `closes`, silent reopen /
        # erased row vs the last committed ledger, rendered-table drift,
        # missing evidence path, forbidden claim - all EXECUTED in a
        # disposable worktree, each killed by its intended diagnostic
        run: python3 tools/ledger/ledger_mutants.py
      - name: Mode-Q semantic validation + ledger consistency (round-3 E-01)
        # Replaces the pre-fix any-file check (a junk file used to pass).
        # ABSENT -> the ledger must hold G0 open; VALID -> the ledger must
        # have closed G0; anything else in the directory -> fail. Only
        # validator success may ever accompany a closed G0.
        run: python3 tools/modeq/validate_modeq.py --ledger docs/ledger/gates.json
      - name: the Mode-Q validator kills its own mutants
        # junk file, truncated raw output, wrong source pin, omitted
        # target, duplicate target, nonzero recorded exit, plus the
        # R4-MODEQ-01 five (junk stdout, argv ['echo','cquery'], well-shaped
        # wrong workspace hash, 2:1 crosswalk, '../' path reference) -
        # all executed
        run: python3 tools/modeq/modeq_mutants.py
      - name: evidence producers kill their own mutants
        run: python3 tools/catalog/evidence_mutants.py
      - name: completeness negative controls
        run: python3 tools/catalog/completeness.py --self-test
      - name: catalogue validator negative controls
        run: python3 tools/catalog/validate_catalog.py --self-test
      - name: catalogue conforms to the normative v14 contract schema
        run: python3 tools/catalog/validate_catalog.py
      - name: catalogue lock digest equals the CURRENT source lock (R5-EVID-01, blocking)
        # HARD failure (R5-EVID-01 closed the R4-EVID-01a warning era): the
        # catalogue was regenerated against the current source-lock.json, so
        # any source-lock change without catalogue regeneration must turn CI
        # red here - a stale denominator identity is a false-green release
        # gate, never a warning.
        run: python3 tools/catalog/validate_catalog.py --require-current-lock
      - name: materialise the pinned source graph
        # completeness (--results) cross-checks the catalogue's failpoint
        # leaves against the fail_point registry in the typedb source tree, so
        # the sources must be present in this job too (same materialisation the
        # source-identity/storage jobs run).
        run: python3 tools/source-lock/materialize_sources.py
      - name: archived corpus bundle re-verifies from raw logs
        # reparse every archived log, re-bind hashes, recompute the bundle
        # root against the COMPLETE seal, re-check the flake ledger's
        # fingerprints - the archived observation must still be derivable
        # from its own raw material on every commit
        run: |
          python3 tools/catalog/run_u0.py --verdict-only --out docs/evidence/G3/u2s3-full-3
          python3 tools/catalog/completeness.py --results docs/evidence/G3/u2s3-full-3
      - name: qualification plan v2 has not drifted from the catalogue (R4-EVID-01)
        # committed plan body must recompute to its own plan_root AND match
        # a fresh rebuild from the committed catalogue; needs the pinned
        # behaviour checkout (materialised above) for the cucumber anchors
        run: python3 tools/catalog/build_plan_v2.py --check
      - name: plan lock digest equals the CURRENT source lock (R5-EVID-01, blocking)
        # HARD failure, same rule as the catalogue step above: the plan
        # copies the catalogue's lock digest, so a regenerated catalogue
        # with an un-regenerated plan (or a lock change with neither) fails
        # here instead of warning.
        run: python3 tools/catalog/build_plan_v2.py --check --require-current-lock
      - name: independent evidence verifier over the archived bundle (R4-EVID-03a)
        # tools/evidence/verify_all.py shares no code with the producers:
        # own reparse, own bundle root, exact verdict enum, independent
        # policy re-derivation from rows + flake ledger, plan root
        # recomputed from the plan's canonical body. Default mode: byte
        # integrity of the historical archive must hold (its legacy
        # COMPLETE keeps qualification_pass false, loudly reported).
        run: python3 tools/evidence/verify_all.py docs/evidence/G3/u2s3-full-3
      - name: the independent verifier kills its own mutants (R4-EVID-03a)
        # deleted log, edited count, duplicated row, tampered COMPLETE,
        # policy edit without re-run, stale cached verdict, forged
        # policy-enum, forged plan body, absent verdict/COMPLETE (strict),
        # missing row, recorded-GREEN-over-unledgered-failure - all
        # executed as real subprocesses over mutated archive copies
        run: python3 tools/evidence/evidence_v2_mutants.py
      - name: plan coverage is RED exactly as committed (expected-red, R4-EVID-01)
        # plan_coverage.py must exit 1 (the plan is NOT satisfied - E-02's
        # machine-readable honesty) AND regenerate the committed report
        # byte-identically: a green result OR a drifted report fails CI.
        run: |
          rc=0
          python3 tools/catalog/plan_coverage.py --out docs/evidence/G1/plan-coverage-v2.json || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "plan_coverage.py exited $rc but the committed plan is NOT satisfied - expected exit 1" >&2
            exit 1
          fi
          git diff --exit-code -- docs/evidence/G1/plan-coverage-v2.json || {
            echo "regenerated plan-coverage-v2.json differs from the committed report - review the drift" >&2
            exit 1
          }
      - name: no delete authority before G13
        # the refusal is the assertion: this MUST exit nonzero
        run: |
          if python3 tools/maintenance/s3_gc.py --delete probe-materialization; then
            echo "s3_gc.py --delete did not refuse; inv. 84 is not enforced" >&2
            exit 1
          fi

  source-identity:
    # The locks, against a real materialisation of the pinned source graph,
    # plus the lock checker's own behavioral forgery controls.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - name: materialise the pinned source graph
        run: python3 tools/source-lock/materialize_sources.py
      - name: source lock
        run: python3 tools/source-lock/lint_source_lock.py
      - name: the lock checker kills its own forgery mutants
        run: python3 tools/source-lock/lock_mutants.py
      - name: workspace lock has not drifted
        run: python3 tools/source-lock/generate_workspace_lock.py --check
      - name: the SlateDB fork reconstructs to its recorded digest
        run: python3 tools/fork/materialize_slatedb.py --check

  control-plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22.22.2, not the older 22.12.0: the better-sqlite3 native addon the
          # controller-core suites load segfaults under 22.12.0 (SIGSEGV across
          # journal/lifecycle/migration/query-plans/controller-state) but runs
          # clean on the 22.22.x line the code is developed and verified against.
          node-version: "22.22.2"
      - run: npm ci
      - name: typecheck
        # R5-CI-01: the LOCKED local binary from npm ci, never `npx` (which
        # can silently install an unpinned package when resolution changes)
        run: node_modules/.bin/tsc --noEmit
      - name: the controller core suites (one list, owned by package.json)
        # includes the era-A migration fixtures, the crash-after-every-
        # statement matrix, and the production-surface refusal matrix
        run: npm run test:core
      - name: the standing outbox mutant is still killed
        # an expected-red run: if this passes, the mutant stopped being caught
        run: |
          if CONTROLLER_MUTANT=drop-outbox-event node --test --experimental-strip-types \
               src/controller/core/controller-core.test.ts; then
            echo "the drop-outbox mutant was NOT caught" >&2
            exit 1
          fi
      - name: workerd lane
        run: node_modules/.bin/vitest run # locked local binary (R5-CI-01)
      - name: probe harness self-test (21 fail-closed controls, no credentials)
        # PROBE_SELFTEST_EVIDENCE_DIR keeps every evidence bundle the
        # controls produced so the canary scanner below can sweep it
        run: PROBE_SELFTEST_EVIDENCE_DIR="$RUNNER_TEMP/probe-selftest-evidence" bash probes/self-test.sh
      - name: secret canary scan over the self-test evidence (round-3 P-01)
        # The mock provider mints canary-shaped credentials
        # (AKIACANARY…, MOCKSECRETCANARY…, eyJCANARY…); a single hit in any
        # evidence bundle or control log means the redaction pipeline
        # regressed. Fail-closed: a missing/empty directory is an error.
        # python3 comes from the pinned ubuntu-24.04 runner image.
        working-directory: .
        run: python3 tools/ci/scan_secret_canaries.py "$RUNNER_TEMP/probe-selftest-evidence"
      - name: protocol E2E on real workerd
        # the full 85-check protocol matrix against wrangler dev - the same
        # workerd runtime production uses, local-dev surface
        run: |
          # R4-STACK-01: the DEFAULT wrangler.toml is the managed fail-closed
          # posture; the E2E exercises the EXPLICIT local-dev config.
          # locked local binary, never npx (R5-CI-01)
          node_modules/.bin/wrangler dev -c wrangler.local-dev.toml --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          WRANGLER_PID=$!
          for i in $(seq 1 90); do
            curl -s -m 2 http://127.0.0.1:8787/health > /dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -s -m 2 http://127.0.0.1:8787/health > /dev/null 2>&1; then
            echo "wrangler dev did not come up" >&2; cat /tmp/wrangler-dev.log >&2; exit 1
          fi
          node scripts/local-stack-e2e.mjs && STATUS=0 || STATUS=$?
          kill "$WRANGLER_PID" 2>/dev/null || true
          exit $STATUS

  storage:
    # The Rust lanes that fit in a CI budget: the pure protocol models and the
    # storage library's own unit tests (which include the SlateDB adapter's
    # read-contract, recovery, checkpoint, materialisation, posture, memo and
    # retry controls). The full corpus is not here - see the header.
    #
    # Round-3 E-06 choice, stated not hidden: the always-on push job keeps
    # `--lib` (the storage build alone is the bulk of this job's budget);
    # the INTEGRATION tests - `cargo test -p storage --tests --lib`, which
    # picks up tests/ (including test_recovery as it becomes real) - run in
    # the dispatch-only compile-and-catalogue-drift job below, so they are
    # part of the same recorded qualification commands rather than skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.93.0"
      - name: native prerequisites (bounded by the pinned runner image)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake pkg-config libclang-dev
      - name: materialise and stage the fork
        run: |
          python3 tools/source-lock/materialize_sources.py
          # the patched SlateDB the fork links via [patch.crates-io]
          # (round-3 S-02): reconstruct sources/slatedb-fork or cargo cannot
          # resolve the `slatedb` path dependency.
          python3 tools/fork/materialize_slatedb.py
          python3 tools/fork/stage.py
      - name: protocol models
        run: cargo +1.93.0 test --manifest-path tools/Cargo.toml -p protocol-models --locked
      - name: storage library
        working-directory: sources/typedb
        run: cargo +1.93.0 test -p storage --lib --locked
      - name: "durability library (§11: storage/durability unit is a PR gate)"
        working-directory: sources/typedb
        run: cargo +1.93.0 test -p durability --lib --locked
      - name: the shipped external-epoch fence is RESOLVED in the graph
        # R6-TRUTH-01/R5-STOR-04: `cargo tree -e features` must show
        # slatedb/external_epoch_required on the storage dependency. A build
        # that quietly lost the feature would still compile and would still
        # pass tests that never open an unfenced writer.
        run: python3 tools/fork/check_strict_epoch.py
      - name: "the STRICT epoch suite (PR tier: full feature-on + negative fence)"
        # R6-FORK-01 changed what this gate MEANS, so this comment changed
        # with it. It used to enforce "every feature-on failure is caused by
        # the fence" — an invariant that tolerated 420 upstream test bodies
        # never running. They run now: feature-on is 2012 passed / 0 failed
        # with an EMPTY exclusion list, and a fence refusal during the
        # feature-on suite is a FAILURE, not an expected outcome.
        #
        # --quick runs the full feature-on suite plus the negative fence
        # suite and prints PARTIAL, never PASS: it deliberately omits the
        # feature-OFF regression oracle and the leaf reconciliation, which
        # are the clauses that prove the bodies ran BY NAME. Only the
        # nightly tier (same gate, no --quick) can print PASS, and only that
        # result may be cited as evidence.
        run: python3 tools/fork/check_strict_epoch_suite.py --quick
      - name: the resolved dependency graph matches what the docs claim (R6-TRUTH-01)
        # SEMANTIC, not grep: cargo metadata's resolve graph decides where
        # slatedb comes from, and the registered documentation claims are
        # checked against that. Runs here because it needs the STAGED
        # workspace the job already materialised.
        run: python3 tools/ci/check_dependency_sources.py

  hygiene:
    # R6-HYGIENE-01, §11 row "fmt + `git diff --check` + Clippy/warnings".
    # Before this job existed none of these three ran anywhere, and all three
    # were red: the tools workspace produced ~180 rustfmt hunks (it is written
    # in the 120-column project style and was being checked against rustfmt's
    # 100-column DEFAULTS - fixed by committing tools/rustfmt.toml), the
    # SlateDB patch files tripped `git diff --check` on diff-context spaces
    # (fixed by a `-whitespace` attribute, because stripping them would
    # CORRUPT the patches), and Clippy was never run outside the audit's
    # reproduction list.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # `git diff --check` over the PR range needs the base
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          # the FORMATTING toolchain is pinned separately from the build
          # toolchain: rustfmt output changes between nightlies, so a floating
          # nightly would make "formatted" mean something different each day
          toolchain: "nightly-2026-04-15"
          components: rustfmt
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.93.0"
          components: clippy
      - name: no trailing whitespace / space-before-tab / CR anywhere in the diff
        # `.gitattributes` exempts *.patch (a unified diff encodes an empty
        # context line as a single space; "fixing" it breaks the patch), and
        # tools/fork/materialize_slatedb.py --check is the real integrity
        # gate for those files.
        run: |
          # No `||` fallbacks: every applicable range must pass on its own.
          # A `cmd_a || cmd_b` here would let a real failure on the range be
          # masked by a trivially-clean working tree.
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            git diff --check "$base"...HEAD
          fi
          if git rev-parse -q --verify "HEAD^" >/dev/null 2>&1; then
            git diff --check "HEAD^" HEAD
          fi
          git diff --check          # unstaged
          git diff --check --cached  # staged
      - name: rustfmt - tools workspace (style pinned by tools/rustfmt.toml)
        run: cargo +nightly-2026-04-15 fmt --manifest-path tools/Cargo.toml --all -- --check
      - name: rustfmt - the TypeDB soft fork (style pinned by fork/typedb/rustfmt.toml)
        # The fork is high-churn and gets rebased onto upstream; unformatted
        # hunks are exactly what turns a rebase into a merge archaeology
        # session. Run `cargo +nightly-2026-04-15 fmt --manifest-path
        # fork/typedb/Cargo.toml --all` to fix.
        run: cargo +nightly-2026-04-15 fmt --manifest-path fork/typedb/Cargo.toml --all -- --check
      - name: clippy -D warnings - protocol-models
        run: cargo +1.93.0 clippy --manifest-path tools/Cargo.toml -p protocol-models --all-targets --locked -- -D warnings
      - name: clippy -D warnings - storage-diff-spike
        # Two intentional deviations are `#[allow]`ed AT THE SITE with the
        # reason written down (an infinite seeded generator that must not be
        # an Iterator; a differential seed grouped to read as "slatedb"),
        # which is the documented-allowance shape R6-HYGIENE-01 asks for -
        # not a crate-level suppression.
        run: cargo +1.93.0 clippy --manifest-path tools/Cargo.toml -p storage-diff-spike --all-targets --locked -- -D warnings
      - name: clippy -D warnings - remote-wal-spike
        run: cargo +1.93.0 clippy --manifest-path tools/Cargo.toml -p remote-wal-spike --all-targets --locked -- -D warnings
      - name: the warning ratchet's own mutants
        run: python3 tools/ci/warning_ratchet.py --self-test

  supply-chain:
    # R6-SUPPLY-01 + R6-TRUTH-01 + R6-PORT-01, §11 row
    # "dependency/advisory/license scan" (required in ALL THREE tiers).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - name: install both npm workspaces from their locks
        # `npm ci` (never `npm install`): the lock is the input, not a
        # suggestion, and `npm audit` over a re-resolved tree audits something
        # nobody committed.
        run: |
          (cd stack && npm ci)
          (cd control-plane && npm ci)
      - name: the advisory gate kills its own mutants
        # expired exception, brand-new unlisted advisory, unbounded expiry,
        # stale exception, exception missing its compensating control, an
        # audit document that omits `vulnerabilities` (must not read as
        # clean), and four lockfile-provenance mutants
        run: python3 tools/ci/check_npm_advisories.py --self-test
      - name: every advisory has an unexpired reviewed exception, and every locked package is registry-signed
        # This is the gate, not `npm audit` itself: a reported advisory needs
        # a row in tools/ci/dependency-advisory-policy.json with reachability,
        # compensating control, owner and an expiry <= 90 days. --lockfile
        # additionally requires `resolved` on an allowed registry plus an
        # `integrity` digest for every entry (the SBOM/provenance floor).
        run: python3 tools/ci/check_npm_advisories.py --lockfile
      - name: the dependency-source linter kills its own mutants (R6-TRUTH-01)
        # graph reverts to crates.io, the shipped fence feature disappears,
        # the fork path is swapped, the version drifts, metadata arrives with
        # no resolve graph - plus prose mutants over real copies of the real
        # documents, including a REQUIRED statement being quietly deleted
        run: python3 tools/ci/check_dependency_sources.py --self-test
      - name: the release identity template is intact and export-subst is declared (R6-PORT-01)
        run: python3 tools/release/release_identity.py --check
      - name: the release identity resolves in all four source postures
        # checkout / git archive / release tarball / installed package, plus
        # two negative postures (a naked copy and a tampered identity) that
        # must REFUSE. Both resolvers are exercised - the Python one CI uses
        # and the TypeScript one the probes call.
        run: python3 tools/release/release_identity_selftest.py
      - name: the ENVIRONMENT-BLOCKED classifier is a distinct outcome (R6-CI-01)
        run: python3 tools/ci/capability_probe.py --self-test

  provider-corpus-capability:
    # §11 row "RustFS short semantics" is a PR gate, but it needs the
    # source-locked provider binary. Probe first, classify honestly.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      blocked: ${{ steps.probe.outputs.blocked }}
      missing: ${{ steps.probe.outputs.missing }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - name: materialise the pinned source graph (brings in the locked RustFS binary)
        run: python3 tools/source-lock/materialize_sources.py
      - id: probe
        name: can this runner execute the provider corpus?
        run: |
          python3 tools/ci/capability_probe.py \
            --require rustfs --require cargo --require "disk:20" \
            --lane provider-corpus-short \
            --runner-hint "a runner with egress for the source-locked RustFS binary and >=20 GiB free disk" \
            --github-output --out blocked.json --json
      - name: record the verdict in the job summary
        # NOT actions/upload-artifact: every action in this repository is
        # pinned by a SHA that was resolved and recorded, and no verified SHA
        # for an artifact action exists in this file yet. Adding an unverified
        # pin to make a log prettier would trade a real supply-chain
        # guarantee for convenience. The verdict is printed here and written
        # to the step summary; wiring a SHA-pinned artifact upload is a
        # recorded remainder for whoever adds the release pipeline.
        if: always()
        run: |
          {
            echo "### provider-corpus capability verdict"
            echo '```json'
            cat blocked.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  provider-corpus-short:
    # SHORT RustFS semantics: the 11 semantic controls plus a few CAS rounds,
    # so a PR that breaks conditional-create or byte-exactness is caught in
    # minutes. The FULL crash/fault corpus is tier 2.
    needs: provider-corpus-capability
    if: needs.provider-corpus-capability.outputs.blocked != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.93.0"
      - name: materialise the pinned source graph
        run: python3 tools/source-lock/materialize_sources.py
      - name: short RustFS semantics + CAS
        # The corpus refuses to run on a dirty tree (R6-EVID-01) and refuses
        # to report green if the executed-test count does not match the
        # expected corpus size, so a "short" run cannot silently become an
        # empty one - only the ROUND COUNTS are reduced here.
        env:
          S3_CERT_PROVIDER: rustfs
          S3_CERT_CAS_ROUNDS: "10"
          S3_CERT_CAS_WRITERS: "8"
          S3_CERT_UPDATE_ROUNDS: "5"
          S3_CERT_MP_ROUNDS: "2"
          S3_CERT_MP_PROCS: "4"
          S3_CERT_EVIDENCE_DIR: ${{ runner.temp }}/s3-cert-short
        run: tools/s3-cert-corpus/run-corpus.sh
      - name: the bundle verifies independently
        run: python3 tools/s3-cert-corpus/verify-bundle.py "${{ runner.temp }}/s3-cert-short"

  provider-corpus-environment-blocked:
    # THE distinction §11 demands, implemented rather than described.
    #
    # This job exists so that "the corpus could not run here" is neither a
    # pass nor a source failure. It runs ONLY when the capability probe said
    # BLOCKED, and it FAILS - deliberately - with exit 75 and a classified
    # annotation naming the missing capability and the runner that is needed.
    #
    # What was rejected and why:
    #   `continue-on-error: true` -> the job reports SUCCESS. A gate that did
    #     not run must never be indistinguishable from a gate that passed.
    #   `if:` on the real job alone -> the job reports SKIPPED, which branch
    #     protection also treats as satisfied. Same false green.
    needs: provider-corpus-capability
    if: needs.provider-corpus-capability.outputs.blocked == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - name: report ENVIRONMENT-BLOCKED as a classified nonzero outcome
        run: |
          python3 tools/ci/capability_probe.py \
            --require rustfs --require cargo --require "disk:20" \
            --lane provider-corpus-short \
            --runner-hint "a runner with egress for the source-locked RustFS binary and >=20 GiB free disk" \
            --gate --out blocked.json --json
      - name: publish the blocked verdict into the job summary
        # runs even though the step above deliberately failed: the classified
        # verdict is the POINT of this job, not a side effect of it
        if: always()
        run: |
          {
            echo "### ENVIRONMENT-BLOCKED (not a pass, not a source failure)"
            echo '```json'
            cat blocked.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compile-and-catalogue-drift:
    # Renamed from `qualification` (round-3 E-06): this job does NOT run
    # U0 - it compiles the workspace (--no-run), regenerates the catalogue,
    # and checks drift, plus the storage integration lane below. A true
    # fresh-execution U0 job (immutable plan, static/script/failpoint/
    # Cucumber/driver lanes, evidence upload) remains an open E-06
    # remainder recorded in the ledger; naming this job "qualification"
    # was claiming that work before it existed.
    # Dispatch-only - it needs a cold ~40 min build - but these are the
    # SAME commands a release qualification must start from, recorded here
    # so "fresh evidence" has one definition.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.93.0"
      - name: native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake pkg-config libclang-dev
      - name: materialise sources
        run: python3 tools/source-lock/materialize_sources.py
      - name: pristine catalogue build + regeneration + drift check
        run: |
          PROTOC=$(command -v protoc) CARGO_TARGET_DIR="$PWD/pristine-target" \
            cargo +1.93.0 test --manifest-path sources/typedb/Cargo.toml --workspace --locked --no-run
          CARGO_TARGET_DIR="$PWD/pristine-target" \
            python3 tools/catalog/generate_catalog.py --tree sources/typedb
          python3 tools/catalog/validate_catalog.py
          git diff --exit-code -- docs/evidence/G1/upstream-test-catalog.json || {
            echo "catalogue drifted from the committed one - regenerate and review" >&2
            exit 1
          }
      - name: stage the fork (after the pristine drift check, which must see the unstaged tree)
        run: |
          # the staged fork links the patched SlateDB via [patch.crates-io]
          # (round-3 S-02), so reconstruct sources/slatedb-fork before the
          # post-staging cargo build resolves the path dependency.
          python3 tools/fork/materialize_slatedb.py
          python3 tools/fork/stage.py
      - name: storage integration tests (E-06 - includes tests/, e.g. test_recovery)
        # R5-QUAL-01: NOT --all-targets. That flag also EXECUTES bench
        # targets, and benches/bench_rocks.rs is a CLI that panics without a
        # database argument - the previous command was deterministically red
        # after every real test had passed. `--tests --lib` runs every unit
        # and integration test binary; the bench targets are compile-checked
        # separately below (never executed). Kept here (dispatch) rather
        # than on push because of the build cost - see the storage job
        # comment.
        working-directory: sources/typedb
        run: cargo +1.93.0 test -p storage --tests --lib --locked
      - name: storage benches still compile (R5-QUAL-01 - compile check only, never executed)
        working-directory: sources/typedb
        run: cargo +1.93.0 bench -p storage --no-run --locked

  quality-controller:
    # Spec §14.1 (tier A) and §14.2 (tier B) of the agentic code-quality
    # specification, mapped onto THIS repository's tier 1.
    #
    # ONE interface, four verbs, no hand-built scope flags:
    #
    #     cargo xtask quality fast
    #     cargo xtask quality pr           --base <BASE_SHA>
    #     cargo xtask quality full
    #     cargo xtask quality policy-check --base <BASE_SHA>
    #
    # Everything that decides what a gate MEANS - thresholds, the trusted
    # CRAP baseline, coverage scope, mutation scope, the architecture edges,
    # the protected-path list - lives in `.quality/` and is read by the
    # controller. It is deliberately NOT in this file, so that editing a
    # workflow cannot change a verdict without also editing protected policy,
    # which `policy-check` then refuses.
    #
    # WHAT THIS JOB IS HONEST ABOUT:
    #
    #   * The `xtask` crate that implements these verbs and the `cargo xtask`
    #     alias in `.cargo/config.toml` land in the same change set as this
    #     job. Both were verified present and resolving from the repository
    #     root before this job was written: `cargo xtask` prints the four
    #     modes below and exits with the documented codes (0 pass, 1 quality
    #     failure, 2 policy violation, 3 infrastructure failure). If either
    #     is ever removed, `cargo xtask ...` exits nonzero and this job goes
    #     RED rather than skipping - deliberately. The cheaper shapes
    #     (`if: hashFiles('xtask/**') != ''`, `continue-on-error: true`, a
    #     trailing `|| true`) all make "the gate did not run" and "the gate
    #     passed" indistinguishable, which is the one thing the tier map's
    #     §11 rules and the quality spec's §19 both forbid. A missing
    #     controller is a missing gate, and a missing gate is red.
    #
    #   * The toolchain pins are load-bearing for this job specifically. The
    #     controller checks the running toolchain against
    #     `.quality/tools.lock.toml` and reports an InfrastructureFailure on
    #     a mismatch, so the `1.93.0` toolchain step below must remain the
    #     LAST rust-toolchain action in this job (it becomes the default).
    #
    #   * TIER B needs a TRUSTED BASE SHA and only a `pull_request` event has
    #     one. On a bare `push` the job runs tier A (`quality fast`) and says
    #     so in an annotation; it does not invent a baseline from the pushed
    #     tree, because a baseline derived from the code under test is not a
    #     baseline (spec §2.5). Merge decisions therefore come from the
    #     pull_request run. The job is not skipped on push - a skipped
    #     required check reads as green to branch protection.
    #
    #   * THE FIRST CHANGE THAT LANDS THE QUALITY SYSTEM TRIPS ITS OWN POLICY
    #     GATE. `policy-check` refuses any implementation diff that touches
    #     `.quality/**` or `.github/workflows/**`, and the change that
    #     CREATES those files touches them by definition. That PR must travel
    #     the independent-review path described in `.quality/README.md`. It
    #     is recorded here rather than worked around, because the workaround
    #     would be to weaken the check.
    #
    #   * No evidence artifact is uploaded. `actions/upload-artifact` is not
    #     used anywhere in this repository: every action here is pinned to a
    #     commit SHA that was resolved and recorded, and no verified SHA for
    #     an artifact action exists in this file (see the identical note in
    #     `provider-corpus-capability`). The controller's report is printed
    #     into the job summary instead. Wiring a SHA-pinned upload is a
    #     recorded remainder, not a silent omission.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the controller resolves a diff against the trusted base SHA and
          # builds a detached worktree at that SHA for the baseline; a
          # shallow clone cannot do either
          fetch-depth: 0
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          # the FORMATTING toolchain, pinned separately from the build
          # toolchain for the reason given in the `hygiene` job
          toolchain: "nightly-2026-04-15"
          components: rustfmt
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.93.0"
          components: clippy, llvm-tools-preview
      - name: native prerequisites (bounded by the pinned runner image)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake pkg-config libclang-dev
      - name: install the npm workspaces from their locks
        # `npm ci`, never `npm install`: the TypeScript gates must run against
        # the committed lockfile, not a re-resolved tree.
        run: |
          (cd stack && npm ci)
          (cd control-plane && npm ci)
      - name: materialise and stage the fork
        # Same three commands as the `storage` job. The Rust production scope
        # includes `fork/typedb/**`, whose workspace-global
        # `[patch.crates-io] slatedb = { path = "../../sources/slatedb-fork" }`
        # cannot resolve until the SlateDB fork is reconstructed. The
        # controller decides from the diff whether it needs any of this
        # (`.quality/policy.toml` [[scope.rule]]); the job's duty is only to
        # make the environment capable, never to decide the gate.
        run: |
          python3 tools/source-lock/materialize_sources.py
          python3 tools/fork/materialize_slatedb.py
          python3 tools/fork/stage.py
      - name: "quality gate: tier B on a pull request, tier A on a bare push"
        env:
          # consumed through env rather than interpolated into the shell:
          # a `${{ }}` expansion inside `run:` is a shell-injection shape
          # regardless of today's producer (spec §19)
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE:-}" ]; then
            echo "trusted base SHA: $PR_BASE (pull_request) - running tier B"
            # protected quality policy first (§12/§14.2 "always"): a diff that
            # smuggles a threshold, baseline, exclusion or workflow change
            # into an implementation change is refused here, before any gate
            # has a chance to be measured against the modified rules.
            cargo xtask quality policy-check --base "$PR_BASE"
            cargo xtask quality pr --base "$PR_BASE"
          else
            echo "::notice title=QUALITY-TIER-A::no pull_request base SHA on a ${GITHUB_EVENT_NAME} event; running tier A only. A trusted baseline cannot be derived from the tree under test (spec 2.5), so the merge decision comes from the pull_request run of this job."
            cargo xtask quality fast
          fi
      - name: publish the quality report into the job summary
        # `if: always()` so the report is visible when the gate FAILED, which
        # is when it matters. This step reads a file; it cannot turn a failed
        # gate green, and the job's conclusion is still the gate's.
        if: always()
        run: |
          report=artifacts/quality/quality-report.json
          {
            echo "### quality report"
            if [ -f "$report" ]; then
              echo '```json'
              cat "$report"
              echo '```'
            else
              echo "No \`$report\` was produced. If the gate above failed before"
              echo "the controller could write one, that is the reason; a missing"
              echo "report is not a pass."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-security-audit:
    # Spec §19 "run a GitHub Actions security auditor such as zizmor".
    #
    # It lives in tier 1 because a workflow can only change through a push or
    # a PR, so this is the tier that sees the diff. It is ALSO in tier 2
    # (nightly.yml), for the same reason the dependency scan is in every
    # tier: a newly-published audit rule fires against unchanged workflows,
    # and a PR-only scan can only ever see the rules that existed when
    # someone happened to open a PR.
    #
    # FAIL-CLOSED. The default `regular` persona, no `--min-severity` and no
    # `--min-confidence` floor: a finding is either fixed, or ignored by
    # exact line in `.github/zizmor.yml` with the reason written down. There
    # is exactly one such ignore today and its argument is recorded there.
    # zizmor exits 0 on no findings and 13/14 when findings remain, so the
    # step needs no wrapper to be a gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # R5-CI-01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
      - name: install zizmor from a digest-pinned wheel
        # NOT a zizmor GitHub Action: every action in this repository is
        # pinned to a resolved and recorded commit SHA, and no verified SHA
        # for one exists here. NOT `pip install zizmor==...` either, because
        # that trusts version resolution at install time. This is the same
        # curl + `sha256sum -c` + install shape the Bazel install in
        # nightly.yml uses, which is the strongest pin available without an
        # action.
        #
        # zizmor 1.29.0, manylinux_2_28_x86_64 wheel, resolved from PyPI on
        # 2026-08-20. The package declares no runtime dependencies, so
        # `--no-deps` installs exactly these bytes and nothing else.
        env:
          ZIZMOR_VERSION: "1.29.0"
          ZIZMOR_WHEEL: "zizmor-1.29.0-py3-none-manylinux_2_28_x86_64.whl"
          ZIZMOR_URL: "https://files.pythonhosted.org/packages/b4/f0/dfa67018b76bc4f2f50e265e8cbd1293833d1b1de5f3f02fbbb7487ae9c6/zizmor-1.29.0-py3-none-manylinux_2_28_x86_64.whl"
          ZIZMOR_SHA256: "587b99c2e1b34575c6c8565c2bfde415ca8bc0310f5589f19bc948c8dea10a20"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$ZIZMOR_WHEEL" "$ZIZMOR_URL"
          echo "${ZIZMOR_SHA256}  ${ZIZMOR_WHEEL}" | sha256sum -c -
          python3 -m pip install --no-deps --no-index "./${ZIZMOR_WHEEL}"
          # the wheel ships a compiled binary as a console script, not an
          # importable module, so resolve the script directory rather than
          # trusting PATH ordering
          bin="$(python3 -c 'import os,sysconfig;print(os.path.join(sysconfig.get_path("scripts"),"zizmor"))')"
          "$bin" --version | grep -qx "zizmor ${ZIZMOR_VERSION}"
          echo "ZIZMOR_BIN=$bin" >> "$GITHUB_ENV"
      - name: audit every workflow
        # `--offline`: no GH token, no online audit rules, no network
        # dependence in a gate. The config at .github/zizmor.yml is
        # auto-discovered.
        run: |
          "$ZIZMOR_BIN" --offline --no-progress --color never .github/workflows/
      - name: every checkout drops its credentials (§19, artipacked)
        # zizmor does NOT protect this at the persona this gate runs at.
        # Measured, with one guard flipped to `persist-credentials: true`:
        #   --persona=auditor  -> artipacked fires
        #   --persona=pedantic -> 0
        #   --persona=regular  -> 0    <- what runs above
        # At `regular` the finding is counted "suppressed" and a regression
        # would pass green. Raising the whole gate to `auditor` is not the
        # fix either: the clean tree yields 52 findings there, so the gate
        # would be permanently red or would need a severity floor - and a
        # floor silently swallows unrelated future findings. So this one
        # invariant gets its own exact, fail-closed check instead.
        run: python3 tools/ci/check_workflow_checkouts.py
      - name: the checkout gate can actually fail
        run: python3 tools/ci/check_workflow_checkouts.py --self-test
