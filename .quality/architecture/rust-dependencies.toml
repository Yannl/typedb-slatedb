# Machine-checkable Rust dependency-direction invariants (spec §6).
#
# PROTECTED FILE (.quality/** — see .quality/policy.toml [protected]).
# An implementation agent may not delete or weaken an edge to make its change
# pass. Relaxing an edge is a quality-policy change and takes the independent
# review path, not a line edit in the same commit as the code that needed it.
#
# ---------------------------------------------------------------------------
# HOW THIS FILE IS EVALUATED
# ---------------------------------------------------------------------------
#
# `cargo xtask quality` reads DECLARED dependencies out of
# `cargo metadata --format-version 1 --no-deps --offline` for each workspace
# named below. Declared, not resolved: the question this file answers is
# "which crate did an author choose to depend on", and that is a manifest
# fact. Resolved-graph questions (does the product actually link the SlateDB
# soft fork rather than the registry crate?) are a DIFFERENT question with a
# different, stronger owner — `tools/ci/check_dependency_sources.py`, which
# re-derives them from the full resolve graph. This file deliberately does
# not restate them; two weaker copies of one truth is how a repository ends
# up with two answers.
#
#   workspace  which cargo workspace the edge is evaluated in. There are two,
#              and a crate name alone is ambiguous between them:
#                "fork/typedb"  -> manifest fork/typedb/Cargo.toml
#                "tools"        -> manifest tools/Cargo.toml
#              MEASURED 2026-08-20: `fork/typedb/Cargo.toml` and the staged
#              `sources/typedb/Cargo.toml` declare byte-identical edge sets
#              for all 43 members, so this check runs against the FORK tree
#              and needs neither `materialize_sources.py` nor `stage.py` nor
#              a network fetch. That is what makes it affordable in tier 1.
#   from       must be a member of that workspace.
#   to         a member of that workspace OR an external crate name.
#   reason     why the edge is forbidden. Mandatory.
#
# KINDS. `normal` and `build` dependencies are in scope. `dev-dependencies`
# are NOT, and that is a deliberate, load-bearing choice rather than an
# oversight: `fork/typedb/storage/Cargo.toml` declares `database` as a
# dev-dependency, i.e. the storage crate's own test binaries link the layer
# above it. That upward test-only edge exists today, is upstream TypeDB's
# arrangement rather than this port's, and forbidding it would make this file
# red on arrival for a reason no one in this repository chose. If test-only
# direction ever becomes worth gating, it needs its own list and its own
# argument.
#
# ---------------------------------------------------------------------------
# PROVENANCE OF EVERY EDGE BELOW
# ---------------------------------------------------------------------------
#
# Each edge was checked against real `cargo metadata` output on 2026-08-20,
# and all 33 are CURRENTLY SATISFIED — this file adds no pre-existing debt.
# The facts they were derived from:
#
#   * `slatedb` is declared by exactly ONE crate in the whole product
#     workspace: `storage`. It is the adapter, and it is the only door.
#   * `rocksdb` is declared by exactly two: `storage` and `cache`.
#   * `object_store` is declared by NO first-party crate at all; it reaches
#     the graph only underneath `slatedb` / `slatedb-common` /
#     `slatedb-txn-obj`.
#   * `durability` declares neither `storage` nor any storage engine: the
#     WAL is backend-independent today, and `storage -> durability` is the
#     only direction that exists.
#   * `tools/protocol-models` declares ZERO dependencies of any kind.
#   * `xtask` declares only serde, serde_json, sha2 and toml — it depends on
#     none of the code it measures.
#
# WHAT IS DELIBERATELY ABSENT, so the omissions are reviewable rather than
# invisible:
#
#   * `aws-sdk-s3` appears in NO edge. §6's example names it, but this
#     repository's resolve graph does not contain that crate at any depth —
#     R2 is reached through `object_store` under SlateDB. An edge naming a
#     crate that never appears would look like enforcement and enforce
#     nothing.
#   * `durability -> tokio` is NOT forbidden, although it is satisfied today.
#     The remote WAL (U3/U4) is live work and may have a legitimate reason to
#     make durability async. The graph alone cannot tell that apart from
#     accidental runtime coupling, so this is left to the Architect rather
#     than pre-decided here. `encoding -> tokio` and `concept -> tokio` ARE
#     forbidden: those are domain crates with no such pending work.
#   * `storage-diff-spike` carries no edges. Its integrity property is that
#     it resolves the *registry* SlateDB 0.15.0 rather than the fork, which
#     makes it the oracle for the fork. That is a resolve-graph/source fact
#     already gated by `tools/ci/check_dependency_sources.py`, and a weaker
#     manifest-level restatement here would not add a dimension.
#   * `resource` carries no edges despite being a true leaf (one external
#     dependency, zero internal). Nothing in the port's risk model turns on
#     it staying that way.

schema = 1

# ===========================================================================
# fork/typedb — the TypeDB soft fork. Rust production, full gates.
# ===========================================================================

# --- The durability layer is the write-ahead log. It must not learn about
# --- the key-value engine that consumes it. This is the boundary the U3/U4
# --- remote-WAL work pushes hardest on.

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "slatedb"
reason = "The WAL must stay independent of the KV backend. SlateDB is reached only through the `storage` adapter, which is also the only place the externally-issued-epoch fence (ADR-0012) is threaded; a WAL that opened SlateDB itself would open it unfenced."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "rocksdb"
reason = "Same boundary as the SlateDB edge, for the classic engine. `storage` and `cache` are the only crates that may name RocksDB; the U0/U1 oracle lanes stay comparable to U2/U3 only if the WAL is identical across them."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "object_store"
reason = "Remote durability must be expressed as the remote WAL protocol against the Durable Object write authority, not as direct object-store I/O. A raw object_store client inside durability would write R2 objects outside SlateDB's manifest and outside the fence."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "storage"
reason = "Dependency direction. `storage -> durability` is the real and only edge; the reverse would create a cycle and would let recovery policy leak from the engine into the log."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "tonic"
reason = "The remote WAL client belongs in the control-plane surface and `tools/remote-wal-spike`, not inside the durability crate. A service transport here would put write-authority negotiation below the storage boundary."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "durability"
to = "typedb-protocol"
reason = "The WAL must not depend on the externally visible service protocol. Only `server` speaks it."

# --- Domain crates: encoding and concept are the data model. They may use
# --- `storage` and `durability` as abstractions and must not know which
# --- engine or runtime is underneath.

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "encoding"
to = "slatedb"
reason = "Encoding depends on `storage` as an abstraction. A direct SlateDB dependency would make the on-disk encoding a function of the object-store engine and would bypass the adapter that carries the epoch fence."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "encoding"
to = "rocksdb"
reason = "Same boundary for the classic engine: the encoding must be identical in the RocksDB and SlateDB lanes, which is precisely what makes the U1-vs-U2 differential a valid oracle."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "encoding"
to = "object_store"
reason = "Infrastructure must not cross into the domain. Encoding has no business addressing object storage."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "encoding"
to = "tokio"
reason = "The domain is runtime-independent (spec §6). Encoding is synchronous today; async here would push a runtime requirement onto every caller of the data model."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "concept"
to = "slatedb"
reason = "Concept is the type/instance domain and reaches persistence only through `storage`."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "concept"
to = "rocksdb"
reason = "Same boundary for the classic engine."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "concept"
to = "object_store"
reason = "Infrastructure must not cross into the domain."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "concept"
to = "tokio"
reason = "The domain is runtime-independent (spec §6). Concept is synchronous today."

# --- The database crate is the composition layer over the domain. It may
# --- depend inward on `storage`; it must not reach past it to an engine.

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "database"
to = "slatedb"
reason = "`database` composes `storage`, `durability` and the domain. Naming SlateDB here would create a second, unfenced route to the object-store engine alongside the adapter."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "database"
to = "rocksdb"
reason = "Same boundary for the classic engine: storage-profile selection (U0..U4) is the adapter's responsibility, not the composition layer's."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "database"
to = "object_store"
reason = "Infrastructure must not cross the storage boundary."

# --- The storage adapter itself. It is allowed to be the one crate that
# --- knows about engines. It is not allowed to become a second control
# --- plane, and it is not allowed to go around SlateDB to the bucket.

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "storage"
to = "object_store"
reason = "The adapter's contract with R2 is the SlateDB soft fork's API, which is where the externally-issued epoch fence lives (ADR-0012, fork/slatedb/patches). A direct object_store client inside `storage` could read or write bucket objects outside SlateDB's manifest and outside the fence — the exact bypass the fork exists to prevent. This is the one edge that constrains the adapter itself."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "storage"
to = "axum"
reason = "Write authority, fencing and lease negotiation belong to the Worker/Durable Object control plane. A storage crate that served HTTP would be a second authority with no fencing story."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "storage"
to = "tonic"
reason = "Same boundary as the axum edge, for gRPC. `server` is the only service surface."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "storage"
to = "typedb-protocol"
reason = "The storage adapter must not depend on the externally visible service protocol; that coupling would make an encoding change a protocol change."

[[architecture.forbidden_edge]]
workspace = "fork/typedb"
from = "storage"
to = "clap"
reason = "Argument parsing belongs to the composition roots (`server`, `database-tools`, the admin binaries). A library crate that parses a command line has acquired a second, untested entry point."

# ===========================================================================
# tools — the Rust support workspace. `remote-wal-spike` is production per
# the owner scope decision of 2026-08-20; the rest is tooling; `xtask` is
# the quality controller and gates itself.
# ===========================================================================

# --- protocol-models is the executable protocol specification. It has zero
# --- dependencies of any kind, on purpose: both the Rust side and the
# --- TypeScript control plane are checked against it, so its behaviour must
# --- not be a function of any third party's version.

[[architecture.forbidden_edge]]
workspace = "tools"
from = "protocol-models"
to = "tokio"
reason = "The protocol models are pure, deterministic and synchronous. A runtime dependency would make the reference model unusable as a decision procedure inside other contexts and would make its behaviour schedule-dependent."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "protocol-models"
to = "ureq"
reason = "The models describe the fencing/WAL/journal protocol; they must not also speak it. Transport belongs to `remote-wal-spike` and to the control plane."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "protocol-models"
to = "slatedb"
reason = "The protocol layer is independent of the storage engine. A SlateDB dependency here would couple the reference model to the object-store implementation it is supposed to be checkable against."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "protocol-models"
to = "serde"
reason = "The crate is declared as 'pure deterministic models' and today has no dependencies at all, so its wire encodings are written out rather than derived. Adding a serialization framework changes what the reference model IS — it is a design decision with an independent-review path, not an incidental import. THIS IS THE EDGE MOST LIKELY TO BE LEGITIMATELY RELAXED; relax it deliberately if so."

# --- remote-wal-spike is the reference client for the L1 remote WAL
# --- protocol against the Durable Object write authority.

[[architecture.forbidden_edge]]
workspace = "tools"
from = "remote-wal-spike"
to = "slatedb"
reason = "The U3 profile's whole claim is that durability (remote WAL) and the SST/object plane (SlateDB) are separable. The client that proves the WAL half must not link the other half, or the separation is asserted rather than demonstrated."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "remote-wal-spike"
to = "rocksdb"
reason = "Same separation, for the classic engine. The remote WAL client is storage-engine-agnostic by construction."

# --- xtask is the deterministic quality controller. The measuring system
# --- must not depend on the code it measures.

[[architecture.forbidden_edge]]
workspace = "tools"
from = "xtask"
to = "protocol-models"
reason = "The controller decides pass/fail for this crate. If it linked it, a product change could change the verdict-producing machinery, and `cargo xtask quality fast` would rebuild the measured code on every inner-loop run."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "xtask"
to = "remote-wal-spike"
reason = "Same rule: the quality controller must not depend on a crate it gates."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "xtask"
to = "storage-diff-spike"
reason = "Same rule: the quality controller must not depend on a crate it gates."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "xtask"
to = "slatedb"
reason = "The controller must stay cheap and buildable without the storage stack. Linking SlateDB would put an object-store engine and an async runtime behind every `cargo xtask quality fast`."

[[architecture.forbidden_edge]]
workspace = "tools"
from = "xtask"
to = "tokio"
reason = "The controller orchestrates subprocesses and parses their machine-readable output. It has no need of an async runtime, and keeping it out keeps the inner-loop build small."
