# Python coverage exclusions (R8-P1-06).
#
# PROTECTED FILE.
#
# Every entry names a module the pytest coverage run does NOT instrument, and
# says why that is acceptable, who owns it, and when it must be revisited.
#
# WHY THIS LIST IS LONG, AND WHY THAT IS THE HONEST OUTCOME.
#
# The round-8 audit found `py.pytest` reporting "63 % coverage" over FOUR
# imported modules while the project carried 81 Python files. The percentage was
# arithmetically correct and told the reader almost nothing, because its
# denominator was "whatever pytest happened to import".
#
# Most of this repository's Python is EVIDENCE MACHINERY: producers that run a
# qualification lane and seal a bundle, verifiers that independently re-derive
# that bundle from its archived bytes, and mutant suites that attack the
# verifiers as real subprocesses. Those are proved by EXECUTION - a mutant that
# survives fails the suite - and a line-coverage number over them would be a
# weaker statement, not a stronger one. What was missing was not coverage; it
# was a place that SAYS SO, per module, with an owner and a date.
#
# `tools/quality/python_inventory.py` fails on any in-scope module that is
# neither measured nor listed here, and on any entry that no longer names a real
# file. So a NEW Python module cannot be added without either a test or a
# deliberate, owned entry - which is R8-P1-06's acceptance criterion.

