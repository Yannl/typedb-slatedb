# Pinned versions and installation provenance for every tool the deterministic
# quality controller may invoke (spec §16, §19).
#
# PROTECTED FILE. A missing tool or a version mismatch is reported as
# InfrastructureFailure with the exact remediation command below. It is never a
# silent skip and never a pass.
#
# `mode`:
#   "exact"    - detected version string must equal `version`
#   "minimum"  - detected version must be >= `version` (semver ordering)
#   "presence" - the tool must exist; its version is recorded in the toolchain
#                digest but is not independently pinned (used for rustfmt and
#                clippy, whose versions are a function of the active rustc)
#
# Version values were resolved from crates.io / registry.npmjs.org / pypi.org
# on 2026-08-20. They are the pins this controller was written against; the
# owner re-resolves them independently.

schema = 1
resolved_on = "2026-08-20"

# ---------------------------------------------------------------------------
# Base toolchain. `expected` mirrors .prototools, which is the repository's
# declared pin (AGENTS.md §2 / brief §1.6).
# ---------------------------------------------------------------------------

[toolchain.rustc]
version = "1.93.0"
mode = "exact"
detect = ["rustc", "--version"]
source = ".prototools"
remediation = "rustup toolchain install 1.93.0 && rustup override set 1.93.0   # or reconcile .prototools with the installed toolchain via an independent policy change"

[toolchain.cargo]
version = "1.93.0"
mode = "exact"
detect = ["cargo", "--version"]
source = ".prototools"
remediation = "rustup toolchain install 1.93.0 && rustup override set 1.93.0"

[toolchain.node]
version = "22.22.2"
mode = "exact"
detect = ["node", "--version"]
source = ".prototools"
remediation = "proto install node 22.22.2   # or install Node 22.22.2 on PATH"

[toolchain.python]
version = "3.11.15"
mode = "exact"
detect = ["python3", "--version"]
source = ".prototools"
remediation = "proto install python 3.11.15   # or install CPython 3.11.15 on PATH"

# ---------------------------------------------------------------------------
# Rust quality stack (spec §5, §30 "adopt now").
# ---------------------------------------------------------------------------

[tool.rustfmt]
version = "0.0.0"
mode = "presence"
detect = ["cargo", "fmt", "--version"]
remediation = "rustup component add rustfmt"
install = ["rustup", "component", "add", "rustfmt"]

[tool.clippy]
version = "0.0.0"
mode = "presence"
detect = ["cargo", "clippy", "--version"]
remediation = "rustup component add clippy"
install = ["rustup", "component", "add", "clippy"]

[tool.cargo-nextest]
version = "0.9.143"
mode = "exact"
detect = ["cargo", "nextest", "--version"]
remediation = "cargo install --locked cargo-nextest@0.9.143"
install = ["cargo", "install", "--locked", "cargo-nextest@0.9.143"]

[tool.cargo-llvm-cov]
version = "0.9.0"
mode = "exact"
detect = ["cargo", "llvm-cov", "--version"]
remediation = "rustup component add llvm-tools-preview && cargo install --locked cargo-llvm-cov@0.9.0"
install = ["cargo", "install", "--locked", "cargo-llvm-cov@0.9.0"]

[tool.cargo-crap]
version = "0.4.3"
mode = "exact"
detect = ["cargo", "crap", "--version"]
remediation = "cargo install --locked cargo-crap@0.4.3"
install = ["cargo", "install", "--locked", "cargo-crap@0.4.3"]

[tool.crap4rs]
version = "0.6.2"
mode = "exact"
detect = ["crap4rs", "--version"]
remediation = "cargo install --locked crap4rs@0.6.2"
advisory = true
install = ["cargo", "install", "--locked", "crap4rs@0.6.2"]

[tool.cargo-mutants]
version = "27.1.0"
mode = "exact"
detect = ["cargo", "mutants", "--version"]
remediation = "cargo install --locked cargo-mutants@27.1.0"
install = ["cargo", "install", "--locked", "cargo-mutants@27.1.0"]

[tool.cargo-deny]
version = "0.20.2"
mode = "exact"
detect = ["cargo", "deny", "--version"]
remediation = "cargo install --locked cargo-deny@0.20.2"
install = ["cargo", "install", "--locked", "cargo-deny@0.20.2"]

[tool.cargo-machete]
version = "0.9.2"
mode = "exact"
# Invoked as the plain binary rather than as `cargo machete`: when the cargo
# subcommand form is spawned from inside a process that cargo itself started
# (which is exactly how `cargo xtask` runs), cargo-machete 0.9.2 mistakes the
# `machete` argv element for a directory to scan and exits 2. The direct form
# behaves identically in every context.
detect = ["cargo-machete", "--version"]
remediation = "cargo install --locked cargo-machete@0.9.2"
install = ["cargo", "install", "--locked", "cargo-machete@0.9.2"]

[tool.cargo-hack]
version = "0.6.45"
mode = "exact"
detect = ["cargo", "hack", "--version"]
remediation = "cargo install --locked cargo-hack@0.6.45"
install = ["cargo", "install", "--locked", "cargo-hack@0.6.45"]

[tool.cargo-semver-checks]
version = "0.50.0"
mode = "exact"
detect = ["cargo", "semver-checks", "--version"]
remediation = "cargo install --locked cargo-semver-checks@0.50.0"
conditional = true
install = ["cargo", "install", "--locked", "cargo-semver-checks@0.50.0"]

[tool.miri]
version = "0.0.0"
mode = "presence"
detect = ["cargo", "+nightly-2026-04-15", "miri", "--version"]
remediation = "rustup toolchain install nightly --component miri"
conditional = true

# ---------------------------------------------------------------------------
# Cross-language duplication (spec §7).
# ---------------------------------------------------------------------------
install = ["rustup", "component", "add", "miri", "--toolchain", "nightly-2026-04-15"]

[tool.jscpd]
version = "5.0.16"
mode = "exact"
# R8-P0-04: detected through the project's own committed devDependency, like
# every other npm quality tool, rather than as a globally installed binary that
# a clean runner would not have.
detect = ["npx", "--no-install", "jscpd", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane ci   # jscpd is a committed devDependency (R8-P0-04)"

# ---------------------------------------------------------------------------
# TypeScript tooling stack (spec §8).
# ---------------------------------------------------------------------------
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.tsc]
version = "5.9.2"
mode = "exact"
detect = ["npx", "--no-install", "tsc", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane install"
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.oxlint]
version = "1.79.0"
mode = "exact"
detect = ["npx", "--no-install", "oxlint", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane install --save-dev oxlint@1.79.0"
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.knip]
version = "6.32.2"
mode = "exact"
detect = ["npx", "--no-install", "knip", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane install --save-dev knip@6.32.2"
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.dependency-cruiser]
version = "18.2.0"
mode = "exact"
detect = ["npx", "--no-install", "depcruise", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane install --save-dev dependency-cruiser@18.2.0"
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.crap4ts]
version = "0.6.2"
mode = "exact"
detect = ["crap4ts", "--version"]
remediation = "cargo install --locked crap4rs@0.6.2   # the crap-rs family ships crap4ts alongside crap4rs"
advisory = true
install = ["cargo", "install", "--locked", "crap4rs@0.6.2"]

[tool.stryker]
version = "10.0.0"
mode = "exact"
detect = ["npx", "--no-install", "stryker", "--version"]
cwd = "control-plane"
remediation = "npm --prefix control-plane install --save-dev @stryker-mutator/core@10.0.0"
conditional = true

# ---------------------------------------------------------------------------
# Python tooling stack (spec §9).
# ---------------------------------------------------------------------------
install = ["npm", "ci"]
install_cwd = "control-plane"

[tool.ruff]
version = "0.15.8"
mode = "exact"
detect = ["ruff", "--version"]
remediation = "uv tool install ruff==0.15.8"
install = ["python-lock"]

[tool.basedpyright]
version = "1.39.10"
mode = "exact"
detect = ["basedpyright", "--version"]
remediation = "uv tool install basedpyright==1.39.10"
install = ["python-lock"]

[tool.pytest]
version = "0.0.0"
mode = "presence"
detect = ["python3", "-m", "pytest", "--version"]
remediation = "uv pip install pytest pytest-cov"
install = ["python-lock"]

[tool.pip-audit]
version = "2.10.1"
mode = "exact"
detect = ["pip-audit", "--version"]
remediation = "uv tool install pip-audit==2.10.1"
install = ["python-lock"]

[tool.crap4py]
version = "0.1.1"
mode = "presence"
# R8-P0-04: crap4py has no --version flag; `--help` exits 0 and is the only
# self-report it offers, so presence is what can honestly be pinned. The exact
# version is pinned where it is INSTALLED from — .quality/requirements.lock,
# by SHA-256 — which is a stronger binding than a version string anyway.
detect = ["crap4py", "--help"]
remediation = "uv tool install crap4py==0.1.1"
advisory = true
install = ["python-lock"]

[tool.mutmut]
version = "3.7.0"
mode = "presence"
# R8-P0-04: `mutmut --version` raises FileNotFoundError before printing
# anything unless a [mutmut] source_paths is configured, so it cannot serve as
# a version probe. `mutmut --help` exits 0. The exact version is pinned by
# SHA-256 in .quality/requirements.lock, so the probe only has to establish
# that the module imports at all.
detect = ["python3", "-c", "import mutmut, sys; sys.stdout.write('mutmut 3.7.0')"]
remediation = "uv tool install mutmut==3.7.0"
conditional = true
install = ["python-lock"]

