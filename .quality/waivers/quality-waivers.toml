# Quality waivers (spec §13).
#
# PROTECTED FILE. Adding a waiver is a quality-policy change and is refused in
# an ordinary implementation diff by `cargo xtask quality policy-check`.
#
# Every waiver is schema-validated by `cargo xtask quality fast|pr|full`. A
# waiver that is malformed, incomplete or expired is a QualityFailure, not a
# warning. Waiver count is tracked as debt and surfaced in every report.
#
# Required fields (enforced; see [exceptions] in .quality/policy.toml):
#   id           unique, "QW-NNNN"
#   kind         mutation-equivalent | coverage-exclusion | duplication |
#                lint-allow | architecture-edge | crap-hotspot | flaky-test |
#                dependency-advisory
#   path         narrow path; wildcards require `wildcard_justification`
#   reason       mandatory, non-empty, must not be boilerplate
#   owner        accountable role or person
#   issue        tracking issue / ADR reference
#   created      YYYY-MM-DD
#   review_after YYYY-MM-DD, in the future at creation time, at most
#                [exceptions].max_waiver_lifetime_days after `created`
#   approved_by  independent approver; MUST differ from `owner`
#
# Optional:
#   symbol                    function / symbol the waiver is narrowed to
#   wildcard_justification    required if `path` or `symbol` contains a wildcard
#
# There are intentionally no waivers at Phase 0. A PR that adds one must never
# look like an ordinary green change.

schema = 1

# Example of the required shape, kept commented so the file parses to zero
# active waivers:
#
# [[waiver]]
# id = "QW-0042"
# kind = "mutation-equivalent"
# path = "tools/remote-wal-spike/src/bar.rs"
# symbol = "normalize_legacy_header"
# reason = "Mutant changes an internal representation with no observable semantic difference; the observable WAL frame bytes are identical under both branches."
# owner = "architecture"
# approved_by = "human-technical-owner"
# issue = "#1234"
# created = "2026-08-20"
# review_after = "2026-11-20"

[[waiver]]
id = "QW-0001"
kind = "dependency-advisory"
path = "control-plane/package-lock.json"
symbol = "qs (via typed-rest-client, via @stryker-mutator/core)"
reason = "R8-P0-04 committed the exact npm quality tools so `npm ci` can make `npx --no-install` find them at all; before this the TypeScript gates could not run. @stryker-mutator/core@10.0.0 pulls typed-rest-client, which depends on a qs range carrying GHSA-q8mj-m7cp-5q26 (moderate: qs.stringify crashes on null entries in comma-format arrays with encodeValuesOnly). `npm audit fix` does not resolve it - the fixed qs is outside typed-rest-client's declared range - and no newer Stryker line drops the dependency. The exposure here is bounded and stated rather than assumed: Stryker is a DEVELOPMENT mutation-testing tool selected only by tier-C `quality full`, it is never bundled into the deployed Worker (dependency-cruiser rule no-dev-dep-in-production, which is enforced and green), and the code path is a stringify of attacker-controlled query parameters that this repository never reaches. Removing the pin instead would put the TypeScript mutation campaign back to being unrunnable, which is the defect R8-P0-05 exists to close."
owner = "quality-controller"
approved_by = "human-technical-owner"
issue = "R8-P0-04"
created = "2026-08-22"
review_after = "2026-11-20"
