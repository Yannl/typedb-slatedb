name = "typedb-r2-control-plane"
main = "src/controller/worker-entry.ts"
compatibility_date = "2025-11-01"

[[durable_objects.bindings]]
name = "CONTROLLER"
class_name = "DatabaseControllerDO"

# C-08: the container control-protocol authority (durable observation store +
# typed RPC). A binding, not a stub — it exists in every mode even though the
# container process itself is a real-platform residual (matrix CF-02).
[[durable_objects.bindings]]
name = "CONTAINER"
class_name = "DatabaseContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DatabaseControllerDO"]

# C-08: SEPARATE migration tag so the v1 DatabaseControllerDO migration is
# untouched — v2 only introduces the new SQLite-backed container authority.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["DatabaseContainerDO"]

[[r2_buckets]]
binding = "PAYLOADS"
bucket_name = "typedb-payloads-local"

# Q-24: this top-level config IS the L1 local-dev posture, and it says so.
# The managed posture is selected by [env.production]: no keys are configured
# there - they are provisioned as secrets (`wrangler secret put`, env
# production) - and resolveKeyConfig fails DO construction if any of them is
# absent, malformed, a dev constant, or below policy. A production deploy
# that lost its secrets refuses every request; it never runs on dev keys.
[vars]
CONTROLLER_KEY_PROFILE = "local-dev"
# PR0 containment (audit C-P0-01/03/09): ONLY this exact value opens the
# dev-only routes (local issuance, register/fence, budgets, batch, admin,
# raw outbox/audit). [env.production] deliberately does not set it - unset
# means the production surface, so losing the variable closes routes,
# never opens them (worker-entry.ts devOnlyRoute).
CONTROLLER_SURFACE = "local-dev"

[env.production]
[env.production.vars]
CONTROLLER_KEY_PROFILE = "managed"

[[env.production.durable_objects.bindings]]
name = "CONTROLLER"
class_name = "DatabaseControllerDO"

[[env.production.durable_objects.bindings]]
name = "CONTAINER"
class_name = "DatabaseContainerDO"

# Migrations are shared across environments by tag; the production surface
# binds the same v1+v2 SQLite classes.
[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["DatabaseControllerDO"]

[[env.production.migrations]]
tag = "v2"
new_sqlite_classes = ["DatabaseContainerDO"]

[[env.production.r2_buckets]]
binding = "PAYLOADS"
bucket_name = "typedb-payloads"
