# cargo-deny policy for the MATERIALISED TypeDB fork (R8-P1-05).
#
# PROTECTED FILE.
#
# Why this exists SEPARATELY from the repository-root `deny.toml`.
#
# The round-8 audit found `cargo deny` on the fork exiting 15 while the gate
# reported on it as though one policy could serve both trees. It cannot, and
# pretending otherwise had two costs: the fork's gate could never pass, and the
# only way to make it pass would have been to widen the AUTHORED workspace's
# policy to accommodate a dependency graph this project does not own.
#
# The two trees have genuinely different licensing and source models:
#
#   root deny.toml     the AUTHORED workspace (xtask, protocol-models, the two
#                      spikes). Every crate is ours or a published dependency
#                      we chose. It passes with no exceptions at all, and it
#                      must keep doing so.
#   this file          a MATERIALISED upstream checkout, reconstructed from
#                      source-lock at a pinned revision. Its ~40 workspace
#                      members carry no per-crate license field, it resolves
#                      two dependencies from git by tag, and its transitive
#                      graph carries advisories nobody here selected.
#
# What is NOT done here, deliberately: no blanket `unlicensed` suppression, no
# `allow-git = ["*"]`, and no wholesale advisory silence. Every allowance below
# is narrow and says which fact makes it true.

[licenses]
# Same permissive set as the root policy, plus the two families the fork's
# graph adds. BlueOak-1.0.0 is OSI-approved and cargo-deny reports it as such;
# it reaches this graph only through `cucumber`'s codegen (synthez).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BlueOak-1.0.0",
]
confidence-threshold = 0.93

# R8-P1-05 item 3: how the internal TypeDB crates prove license provenance.
#
# They are workspace members of ONE product that ships under a single license,
# recorded at the root of the materialised checkout (fork/typedb/LICENSE,
# MPL-2.0), and they are never published to a registry. Upstream does not
# repeat the license in each member's manifest, so cargo-deny sees ~40
# `unlicensed` crates. `private.ignore` is the mechanism for exactly this case
# — unpublishable workspace members — and it is scoped to THIS workspace by
# living in THIS file. It does not, and must not, suppress an unlicensed
# third-party crate: those still fail, because they are not private.
# `private.ignore` is NOT usable here: it keys off `publish = false`, which
# upstream's Bazel-to-Cargo generation does not emit. So each internal crate is
# CLARIFIED individually, by name, to the license the product actually ships
# under. Explicit and enumerable: a NEW unlicensed crate — internal or third
# party — is not on this list and fails the gate, which is the property a
# blanket suppression would destroy. The list is generated by
# `python3 tools/fork/deny_clarify.py --check`, which re-derives it from the
# workspace members and refuses if it has drifted.

[bans]
multiple-versions = "allow"
# R8-P1-05. Upstream's Bazel-to-Cargo generation emits `workspace = true` for
# every INTRA-WORKSPACE dependency, which resolves to a `*` requirement on a
# PATH dependency. cargo-deny's own `allow-wildcard-paths` cannot express this
# case: it applies only to crates declaring `publish = false`, and the
# generated manifests declare no `publish` key at all.
#
# So the check moves rather than disappearing. The hazard `wildcards = "deny"`
# exists for is an UNPINNED THIRD-PARTY requirement; a `*` on a path dependency
# inside one workspace pins nothing that Cargo.lock and the source-lock
# revision have not already pinned. `python3 tools/fork/deny_clarify.py
# --check-wildcards` asserts exactly the surviving property — that EVERY
# wildcard requirement in this workspace is a path/workspace dependency and
# none is a registry dependency — and it runs in the same gate as this policy.
# A generated manifest that starts wildcarding a crates.io crate fails there.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# R8-P1-05 item 2: the EXACT source-locked git identities, and nothing else.
# Both are pinned by tag in fork/typedb/Cargo.lock and recorded in
# source-lock/source-lock.json; `tools/ci/check_dependency_sources.py`
# re-derives them from cargo metadata. A third git dependency, or either of
# these moving to another repository, fails this gate.
allow-git = [
    "https://github.com/typedb/typeql",
    "https://github.com/typedb/typedb-protocol",
]

[advisories]
yanked = "deny"

# R8-P1-05 item 4, applied to every advisory rather than to `tempdir` alone.
#
# EVERY entry below is an advisory in UPSTREAM's dependency graph at the pinned
# revision. This repository selected none of them and can fix none of them
# without re-resolving upstream's lockfile — which would change the tree the
# whole qualification corpus is measured against, and is an owner decision
# (OD-025), not an implementation fix.
#
# They are listed INDIVIDUALLY and dated, so the set cannot grow silently: a
# NEW advisory, or one on a crate this project does introduce, fails the gate.
# That is the property a blanket ignore would destroy.
ignore = [
    # --- upstream runtime graph -------------------------------------------
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27/0.4.15 (hyper, tonic): unbounded empty DATA frames, LOW severity, patched in 0.4.16. Upstream's lock; bumping it re-resolves the tree the qualification corpus is measured against. OD-025." },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8: CRL distribution-point matching. The fork's TLS path is not exercised by any lane this repository runs (no cluster, no certificates). OD-025." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8: URI name constraints. Same unexercised TLS path. OD-025." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8: wildcard name constraints. Same unexercised TLS path. OD-025." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8: reachable panic in CRL parsing. Same unexercised TLS path. OD-025." },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.26.0 via a test/reporting path; quadratic duplicate-attribute scan on attacker-supplied XML, which this project never parses. OD-025." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.26.0: unbounded namespace-declaration allocation. Same path, same absence of attacker-supplied XML. OD-025." },
    { id = "RUSTSEC-2023-0018", reason = "remove_dir_all 0.5.3, reached only through tempdir (dev-dependency of `durability`). TOCTOU on directory removal in a test temp dir. OD-025." },
    { id = "RUSTSEC-2024-0408", reason = "pprof 0.13.0: unsound slice::from_raw_parts, in a PROFILING dependency that no gate or lane enables. OD-025." },
    # --- unmaintained, upstream's choices ----------------------------------
    { id = "RUSTSEC-2018-0017", reason = "tempdir 0.3.7 is deprecated in favour of tempfile. DEV-ONLY: fork/typedb/durability/Cargo.toml [dev-dependencies]. Replacing it is a one-line upstream change this fork does not own; recorded with an owner and an expiry rather than hidden. OD-025." },
    { id = "RUSTSEC-2024-0375", reason = "atty 0.2.14 unmaintained; upstream CLI colour detection. OD-025." },
    { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 unmaintained; transitive wasm timing shim. OD-025." },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained; compile-time macro only. OD-025." },
    { id = "RUSTSEC-2025-0052", reason = "async-std 1.13.2 discontinued; reached through a test-support dependency. OD-025." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 unmaintained; same unexercised TLS path. OD-025." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained; upstream serialisation. OD-025." },
]

