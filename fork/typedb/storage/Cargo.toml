[features]
	default = []
	# Selects the object-storage backend. Off => RocksDB (the U0 lane, upstream behaviour).
	# On  => SlateDB (the U1 lane). Selection is central: no test file changes either way.
	slatedb-backend = ["dep:slatedb-keyspace"]

