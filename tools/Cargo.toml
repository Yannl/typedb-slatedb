[workspace]
resolver = "2"
members = ["xtask", "corpus-catalog", "conformance-runner", "source-lock"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
corpus-catalog = { path = "corpus-catalog" }
conformance-runner = { path = "conformance-runner" }
source-lock = { path = "source-lock" }

anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
jsonschema = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
walkdir = "2"
