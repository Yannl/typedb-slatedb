# Cargo PROJECTION of the official typedb-driver Bazel behaviour targets.
#
# WHY THIS FILE EXISTS
# --------------------
# sources/typedb-driver/ is source-locked (node TDRIVER, tag 3.12.3) and MUST
# NOT be edited. Its own Cargo workspace cannot build the behaviour tests:
# `[workspace.dependencies.typedb-driver]` there pins `features = ["sync"]`,
# while the Bazel target `//rust/tests/behaviour/steps` depends on the ASYNC
# library `//rust:typedb_driver` (rust/tests/behaviour/steps/BUILD). Building
# the upstream workspace with cargo therefore compiles the async step
# definitions against the sync driver and fails with 115 type errors
# (executed and recorded in the driver-lane evidence bundle).
#
# This workspace is a faithful Cargo PROJECTION of the Bazel graph:
#   //rust:typedb_driver                 -> path dep, default features (async)
#   //rust/tests/behaviour/config:config -> member `config`
#   //rust/tests/behaviour/steps:steps   -> member `steps`
#   //rust/tests/behaviour/{driver,connection}:test_*  -> member `tests`
#
# Every crate root and every [[test]] path points DIRECTLY at the locked
# upstream source file. Nothing is copied, patched or vendored: the bytes
# compiled here are the bytes of the locked TDRIVER tree, and
# tools/drivers/projection_check.py re-derives that fact before any run.
#
# `crate_features_common = ["bazel"]` (rust/tests/behaviour/defs.bzl) is
# deliberately NOT set: the runner executes the test binaries from a working
# directory laid out so the non-bazel relative feature-file paths in the
# upstream test sources resolve onto sources/typedb-behaviour.

[workspace]
resolver = "2"
members = ["config", "steps", "tests"]

[workspace.dependencies]
# Verbatim from sources/typedb-driver/Cargo.toml [workspace.dependencies],
# minus the `features = ["sync"]` on typedb-driver, which the Bazel
# behaviour graph does not apply. projection_check.py enforces the match.
tokio = { version = "1.52.3", default-features = false, features = ["bytes", "default", "fs", "io-std", "io-util", "libc", "macros", "mio", "net", "rt", "rt-multi-thread", "signal", "signal-hook-registry", "socket2", "sync", "test-util", "time", "tokio-macros"] }
smol = { version = "1.3.0", default-features = false, features = [] }
regex = { version = "1.12.3", default-features = false, features = ["default", "perf", "perf-backtrack", "perf-cache", "perf-dfa", "perf-inline", "perf-literal", "perf-onepass", "std", "unicode", "unicode-age", "unicode-bool", "unicode-case", "unicode-gencat", "unicode-perl", "unicode-script", "unicode-segment"] }
cucumber = { version = "0.19.1", default-features = false, features = ["default", "macros"] }
async-std = { version = "1.13.2", default-features = false, features = ["alloc", "async-attributes", "async-channel", "async-global-executor", "async-io", "async-lock", "attributes", "crossbeam-utils", "default", "futures-channel", "futures-core", "futures-io", "futures-lite", "gloo-timers", "kv-log-macro", "log", "memchr", "once_cell", "pin-project-lite", "pin-utils", "slab", "std", "wasm-bindgen-futures"] }
macro_rules_attribute = { version = "0.2.2", default-features = false, features = ["default"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc", "async-await", "default", "executor", "futures-executor", "std", "thread-pool"] }
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "clock", "default", "iana-time-zone", "js-sys", "now", "oldtime", "std", "wasm-bindgen", "wasmbind", "winapi", "windows-link"] }
uuid = { version = "1.21.0", default-features = false, features = ["default", "fast-rng", "rng", "serde", "std", "v4"] }
itertools = { version = "0.14.0", default-features = false, features = ["default", "use_alloc", "use_std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["default", "raw_value", "std"] }
serial_test = { version = "0.9.0", default-features = false, features = ["async", "default", "futures", "log", "logging"] }
typedb-driver = { path = "../../../sources/typedb-driver/rust", default-features = false }
config = { path = "config" }
steps = { path = "steps" }
